<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หนี้สินของฉัน | MintMind</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet"><link href="css/liabilities.css" rel="stylesheet"></head>
<body><nav class="navbar navbar-dark py-3"><div class="container"><a class="navbar-brand fw-bold fs-4" href="index.html"><i class="bi bi-pie-chart-fill brand-dot me-2"></i>MintMind</a><div class="d-flex gap-2"><button id="themeToggle" class="btn btn-sm btn-outline-light"></button><button id="logoutBtn" class="btn btn-sm btn-outline-light">ออกจากระบบ</button></div></div></nav>
<main class="container py-4 py-md-5"><ul class="nav nav-pills gap-2 mb-4"><li><a class="nav-link" href="index.html">แดชบอร์ด</a></li><li><a class="nav-link active" href="liabilities.html"><i class="bi bi-credit-card"></i> หนี้สิน</a></li></ul><section class="liability-hero mb-4"><div><span class="badge text-bg-light text-danger mb-2">ติดตามเพื่อวางแผน</span><h1 class="h3 mb-2">หนี้สินของฉัน</h1><p class="mb-0">บันทึกยอดคงเหลือและวันครบกำหนด เพื่อเห็นยอดที่ต้องชำระชัดเจน</p></div><i class="bi bi-credit-card-2-front-fill"></i></section><div class="row g-3 mb-4"><div class="col-md-6"><section class="card p-3 debt-metric"><small>หนี้สินคงเหลือรวม</small><strong id="totalDebt">฿0</strong></section></div><div class="col-md-6"><section class="card p-3 debt-metric"><small>ยอดชำระต่อเดือน</small><strong id="monthlyDebt">฿0</strong></section></div></div><div class="row g-4"><section class="col-lg-4"><div class="card p-4"><h2 class="h5">เพิ่มหนี้สิน</h2><form id="liabilityForm"><label class="form-label">ชื่อหนี้สิน</label><input id="liabilityName" class="form-control mb-3" placeholder="เช่น บัตรเครดิต" required><label class="form-label">ประเภท</label><select id="liabilityType" class="form-select mb-3"><option>บัตรเครดิต</option><option>สินเชื่อส่วนบุคคล</option><option>สินเชื่อบ้าน</option><option>สินเชื่อรถยนต์</option><option>ผ่อนสินค้า</option><option>อื่น ๆ</option></select><label class="form-label">ยอดคงเหลือ (บาท)</label><input id="liabilityBalance" type="number" min="0" step="0.01" class="form-control mb-3" required><label class="form-label">ยอดชำระต่อเดือน</label><input id="liabilityPayment" type="number" min="0" step="0.01" class="form-control mb-3" placeholder="ไม่บังคับ"><label class="form-label">วันครบกำหนด</label><input id="liabilityDue" type="date" class="form-control mb-3"><label class="form-label">แหล่งข้อมูล</label><input id="liabilitySource" class="form-control" placeholder="เช่น ธนาคาร"><button id="liabilitySubmit" class="btn btn-danger w-100 mt-4">บันทึกหนี้สิน</button><button id="cancelLiabilityEdit" type="button" class="btn btn-outline-secondary w-100 mt-2 d-none">ยกเลิกการแก้ไข</button></form></div></section><section class="col-lg-8"><div class="card p-4 h-100"><div class="d-flex justify-content-between align-items-center mb-3"><div><h2 class="h5 mb-1">รายการหนี้สิน</h2><p class="small text-secondary mb-0">ยอดคงเหลือที่คุณบันทึกล่าสุด</p></div><span id="liabilityCount" class="tag">0 รายการ</span></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>รายการ</th><th>ประเภท</th><th>ครบกำหนด</th><th class="text-end">ยอดคงเหลือ</th><th class="text-end">จ่าย/เดือน</th><th></th></tr></thead><tbody id="liabilityRows"></tbody></table></div></div></section></div></main><div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js?v=20261005-2"></script><script src="js/liabilities.js"></script></body></html>
