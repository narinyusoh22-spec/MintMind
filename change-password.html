<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เปลี่ยนรหัสผ่าน | MintMind</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark py-3"><div class="container"><a class="navbar-brand fw-bold fs-4" href="index.html"><i class="bi bi-pie-chart-fill brand-dot me-2"></i>MintMind</a><div class="d-flex gap-2"><button id="themeToggle" class="btn btn-sm btn-outline-light"></button><button id="logoutBtn" class="btn btn-sm btn-outline-light">ออกจากระบบ</button></div></div></nav><main class="container py-4 py-md-5"><ul class="nav nav-pills gap-2 mb-4"><li><a class="nav-link" href="profile.html"><i class="bi bi-person-circle"></i> โปรไฟล์</a></li><li><a class="nav-link active" href="change-password.html"><i class="bi bi-shield-lock"></i> เปลี่ยนรหัสผ่าน</a></li></ul><div class="row justify-content-center"><div class="col-md-7 col-lg-5"><section class="card p-4"><h1 class="h4 mb-1">เปลี่ยนรหัสผ่าน</h1><p class="text-secondary small mb-4">ตั้งรหัสผ่านใหม่อย่างน้อย 8 ตัวอักษร</p><form id="passwordForm"><label class="form-label">รหัสผ่านใหม่</label><div class="password-wrap mb-3"><input id="newPassword" class="form-control" type="password" minlength="8" autocomplete="new-password" required><button type="button" data-toggle-password="newPassword" aria-label="แสดงรหัสผ่าน"><i class="bi bi-eye"></i></button></div><label class="form-label">ยืนยันรหัสผ่านใหม่</label><div class="password-wrap mb-3"><input id="confirmPassword" class="form-control" type="password" minlength="8" autocomplete="new-password" required><button type="button" data-toggle-password="confirmPassword" aria-label="แสดงรหัสผ่าน"><i class="bi bi-eye"></i></button></div><div class="small text-
