<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>โปรไฟล์ | MintMind</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark py-3"><div class="container"><a class="navbar-brand fw-bold fs-4" href="index.html"><i class="bi bi-pie-chart-fill brand-dot me-2"></i>MintMind</a><div class="d-flex gap-2"><button id="themeToggle" class="btn btn-sm btn-outline-light"></button><button id="logoutBtn" class="btn btn-sm btn-outline-light">ออกจากระบบ</button></div></div></nav><main class="container py-4 py-md-5"><ul class="nav nav-pills gap-2 mb-4"><li><a class="nav-link" href="index.html">แดชบอร์ด</a></li><li><a class="nav-link active" href="profile.html"><i class="bi bi-person-circle"></i> โปรไฟล์</a></li></ul><div class="row justify-content-center"><div class="col-lg-8"><section class="card profile-header p-4 mb-4"><div class="d-flex align-items-center gap-3"><div class="position-relative"><div id="avatar" class="profile-avatar">U</div><label for="avatarFile" class="avatar-edit" title="เปลี่ยนรูปโปรไฟล์"><i class="bi bi-camera"></i></label><input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp" class="d-none"></div><div><h1 id="profileHeading" class="h3 mb-1">กำลังโหลดโปรไฟล์</h1><p id="emailText" class="mb-0 text-secondary"></p><small class="text-secondary">กดไอคอนกล้องเพื่อเปลี่ยนรูป (PNG, JPG, WEBP สูงสุด 2 MB)</small></div></div></section><section class="card p-4"><h2 class="h5 mb-3">ข้อมูลส่วนตัว</h2><form id="profileForm"><div class="mb-3"><label class="form-label">ชื่อที่แสดง</label><input id="displayName" class="form-control" placeholder="เช่น Narin"></div><div class="mb-3"><label class="form-label">อีเมล</label><input id="
