<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ | MintMind</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet"></head><body><div class="auth-wrap"><div class="card auth-card"><div class="row g-0"><section class="col-md-5 auth-hero d-flex flex-column justify-content-between"><div><div class="fs-3 fw-bold mb-5"><i class="bi bi-pie-chart-fill brand-dot me-2"></i>MintMind</div><h1 class="display-6 fw-bold">จัดการเงิน<br>อย่างมั่นใจ</h1><p class="text-white-50">บันทึก วางแผน และไม่พลาดการเตือนสำคัญ</p></div><small class="text-white-50"><i class="bi bi-shield-lock me-1"></i>ข้อมูลแยกตามบัญชีผู้ใช้</small></section><section class="col-md-7 bg-white p-4 p-md-5"><div id="loginBox"><h2 id="heading" class="h3 fw-bold">ยินดีต้อนรับกลับมา</h2><p id="sub" class="text-secondary">เข้าสู่ระบบเพื่อดูข้อมูลการเงินของคุณ</p><div id="notice"></div><form id="authForm"><label class="form-label">อีเมล</label><input id="email" class="form-control mb-3" type="email" placeholder="name@example.com" required><label class="form-label">รหัสผ่าน</label><div class="password-wrap"><input id="password" class="form-control" type="password" minlength="6" required><button id="eye" type="button"><i class="bi bi-eye"></i></button></div><div class="text-end mt-2"><button id="forgotBtn" type="button" class="btn btn-link btn-sm p-0">ลืมรหัสผ่าน?</button></div><button id="submitBtn" class="btn btn-success w-100 mt-4"><span id="submitText">เข้าสู่ระบบ</span><span id="spinner" class="spinner-border spinner-border-sm ms-2 d-none"></span></button></form><p class="text-center small text-secondary mt-4"><span id="switchText">ยังไม่มีบัญชี?</span> <button id="switchBtn" class="btn btn-link p-0 align-baseline">สมัครสมาชิก</button></p></div><div id="successBox" class="d-none text-center py-4"><div class="success-ring"><i class="bi bi-check-lg"></i></div><h2 class="h3 fw-bold mt-3">เข้าสู่ระบบสำเร็จ!</h2><p class="text-secondary">กำลังไปหน้าแดชบอร์ด...</p></div></section></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/login.js"></script></body></html>
