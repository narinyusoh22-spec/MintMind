<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>วางแผน | MintMind</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark py-3"><div class="container"><a class="navbar-brand fw-bold fs-4" href="index.html"><i class="bi bi-pie-chart-fill brand-dot me-2"></i>MintMind</a><div class="d-flex gap-2"><button id="themeToggle" class="btn btn-sm btn-outline-light"></button><button id="logoutBtn" class="btn btn-sm btn-outline-light">ออกจากระบบ</button></div></div></nav><main class="container py-4 py-md-5"><ul class="nav nav-pills gap-2 mb-4"><li><a class="nav-link" href="index.html">แดชบอร์ด</a></li><li><a class="nav-link" href="transactions.html">รายการเงิน</a></li><li><a class="nav-link" href="reminders.html">การเตือน</a></li><li><a class="nav-link active" href="planner.html">วางแผน</a></li></ul><div class="row g-4"><section class="col-lg-6 planner-section"><div class="card p-4 h-100"><h1 class="h5"><i class="bi bi-piggy-bank me-2"></i>งบประมาณรายเดือน</h1><form id="budgetForm" class="row g-2 mb-3"><div class="col-7"><select id="budgetCategory" class="form-select"><option>อาหาร</option><option>เดินทาง</option><option>ช้อปปิ้ง</option><option>บิล/ที่อยู่อาศัย</option><option>สุขภาพ</option><option>บันเทิง</option><option>อื่น ๆ</option></select></div><div class="col-5"><input id="budgetLimit" class="form-control" type="number" min="1" placeholder="งบ ฿" required></div><div class="col-12"><button class="btn btn-success w-100">บันทึกงบ</button></div></form><div id="budgetList" class="empty">ยังไม่ได้ตั้งงบ</div></div></section><section class="col-lg-6 planner-section"><div class="card p-4 h-100"><h2 class="h5"><i class="bi bi-bullseye me-2"></i>เป้า  src="js/config.js?v=20261005-1"></script><script src="js/planner.js"></script></body></html>
