<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายการเงิน | MintMind</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark py-3"><div class="container"><a class="navbar-brand fw-bold fs-4" href="index.html"><i class="bi bi-pie-chart-fill brand-dot me-2"></i>MintMind</a><div class="d-flex gap-2"><button id="themeToggle" class="btn btn-sm btn-outline-light"></button><button id="logoutBtn" class="btn btn-sm btn-outline-light">ออกจากระบบ</button></div></div></nav><main class="container py-4 py-md-5"><ul class="nav nav-pills gap-2 mb-4"><li><a class="nav-link" href="index.html">แดชบอร์ด</a></li><li><a class="nav-link active" href="transactions.html">รายการเงิน</a></li><li><a class="nav-link" href="reminders.html">การเตือน</a></li><li><a class="nav-link" href="planner.html">วางแผน</a></li></ul><div class="row g-4"><div class="col-lg-4"><div class="card p-4"><h1 class="h5">เพิ่มรายการ</h1><form id="transactionForm"><label class="form-label mt-2">ประเภท</label><select class="form-select" id="type"><option value="expense">รายจ่าย</option><option value="income">รายรับ</option></select><label class="form-label mt-3">รายละเอียด</label><input class="form-control" id="description" required><div class="row g-2 mt-1"><div class="col-7"><label class="form-label">จำนวนเงิน</label><input class="form-control" id="amount" type="number" min="1" required></div><div class="col-5"><label class="form-label">หมวดหมู่</label><input id="category" class="form-control" value="อาหาร" required></div></div><label class="form-label mt-3">วันที่</label><input class="form-control" id="transactionDate" type="date" required><label class="form-label mt-3">แนบสลิป <span class="text-secondary small">(ไม่บังคับ)</span></label><input id="receiptFile" class="form-control" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><div class="form-text">รองรับ JPG, PNG, WEBP หรือ PDF ขนาดไม่เกิน 5 MB</div><button class="btn btn-success w-100 mt-3">บันทึกรายการ</button></form></div></div><div class="col-lg-8"><div class="card p-4"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><h1 class="h5 mb-0">รายการล่าสุด</h1><div class="d-flex gap-2"><button id="exportCsv" class="btn btn-outline-success btn-sm">CSV</button><button id="printPdf" class="btn btn-outline-primary btn-sm">PDF</button><button id="clearTx" class="btn btn-outline-danger btn-sm">ล้างทั้งหมด</button></div></div><div class="row g-2 my-3"><div class="col-md-5"><input id="searchInput" class="form-control form-control-sm" placeholder="ค้นหารายการหรือหมวดหมู่"></div><div class="col-md-3"><select id="filterType" class="form-select form-select-sm"><option value="">ทุกประเภท</option><option value="income">รายรับ</option><option value="expense">รายจ่าย</option></select></div><div class="col-md-4"><input id="filterMonth" class="form-control form-control-sm" type="month"></div></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>รายละเอียด</th><th>หมวดหมู่</th><th>วันที่</th><th class="text-end">จำนวนเงิน</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div></main><div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js"></script><script src="js/transactions.js"></script></body></html>
